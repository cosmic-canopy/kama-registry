name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A deploy that is cancelled halfway is worse than one that runs late — queue, never cancel.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }          # the write-once check reads the previous tip's tree
      # Integrity, scope (@kama/* only) and write-once against what was live before this push — the same
      # rules `kama publish` applies, enforced by the host, because git accepts commits `kama publish`
      # never saw. A pull request is checked against its base; a first push has no base and skips history.
      # A new version's tarball is downloaded from the bucket's public domain — no secret needed here.
      - name: check the registry tree
        run: python3 tools/check.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # The kama commit whose tools/site/registry.mjs builds the pages — the layout, stylesheet and highlighter
      # kama-lang.org uses. Pinned, so a change to the kama repository never changes this site unannounced:
      # bump it to take one, after `./ops preview` against that checkout.
      KAMA_SITE_REV: 666905245b0629365fd05957443328fed363b21f   # kama 66690524 — registry.mjs + the mobile nav fix
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }          # each version's page dates it by the commit that added it
      - uses: actions/checkout@v5
        with:
          repository: cosmic-canopy/kama
          ref: ${{ env.KAMA_SITE_REV }}
          path: kama
          sparse-checkout: |
            tools/site
            site
            editor/vscode/syntaxes
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      # registry/ is copied into _site/ byte for byte; the pages are written beside it. This README, ops and
      # tools/ never reach the host. A README is read from each package's newest tarball, checked against its
      # integrity; if the bucket cannot be reached the page says it has none and the build warns — the indexes,
      # which the toolchain needs, are never held back by a page.
      - name: build the pages
        run: |
          npm --prefix kama ci --no-audit --no-fund
          node kama/tools/site/registry.mjs --registry registry --out _site
      - name: deploy _site/ to Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy _site --project-name=kama-registry --branch=main
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
